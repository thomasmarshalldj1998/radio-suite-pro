# SignalPath v3.1 Reference — preset definitions
#
# Every v3.1 module is neutral unless a preset explicitly enables it, so a
# preset written for v3.0 loads with bit-identical audio. Values are SI-ish:
# dBFS for levels, LUFS for loudness, ms for time, % for 0-100 controls,
# kbps for bitrate, Hz for frequencies.
#
# This file is data only: the console's preset browser and the CLI both read
# it, so the two cannot drift.

[meta]
version = 3.1
build = 3.1.0
author = Signalpath
notes = New modules default OFF / BYPASSED / NEUTRAL.

[Reference-Flat]
description = Every processor bypassed, unity gain, for alignment and measurement.
limiter.ceiling_db = 0.0
limiter.enabled = false
eq.enabled = false
agc.enabled = false
multiband.enabled = false
deess.enabled = false
hpf.enabled = false
exciter.enabled = false
rider.enabled = false
ceiling.enabled = false
preduck.enabled = false
density.enabled = false
dualband.enabled = false
clip.pass1 = false
clip.pass2 = false
loudness.target = -23.0

[Mobile-Stream]
description = AAC-targeted 15 kHz pre-shape for mobile networks, -16 LUFS.
limiter.ceiling_db = -1.0
limiter.enabled = true
eq.enabled = true
eq.hpf_hz = 90
eq.presence_db = 1.5
eq.brilliance_db = 0.5
deess.enabled = true
codec.target = aac
codec.lowpass_hz = 15000
codec.hf_preserve = 35
loudness.target = -16.0
truepeak.ceiling_db = -1.0
ceiling.enabled = false
preduck.enabled = false
density.enabled = false
dualband.enabled = false
clip.pass1 = true
clip.ceiling_db = -1.0
clip.pass2 = false

[Music-HiFi-Open]
description = Wide, open music preset; density anchors add weight without squashing.
limiter.ceiling_db = -0.5
limiter.enabled = true
multiband.enabled = true
eq.enabled = true
spatial.width = 1.15
loudness.target = -14.0
density.bass_hz = 90
density.bass_strength = 40
density.mid_hz = 2500
density.mid_strength = 25
density.enabled = true
dualband.enabled = false
clip.pass1 = true
clip.ceiling_db = -0.5
clip.pass2 = false

[Tight-Punchy]
description = Dense competitive music; dual-band attack shaping and harmonic clip.
limiter.ceiling_db = -0.3
limiter.enabled = true
multiband.enabled = true
loudness.target = -11.0
preduck.enabled = true
preduck.detect_ms = 3
preduck.sensitivity = 65
preduck.range_db = 2.5
preduck.release_ms = 40
density.bass_hz = 80
density.bass_strength = 55
density.mid_hz = 2000
density.mid_strength = 30
density.enabled = true
dualband.enabled = true
dualband.low_attack = 20
dualband.low_sustain = 10
dualband.high_attack = 35
dualband.high_sustain = 0
dualband.mode = emphasise
clip.pass1 = true
clip.ceiling_db = -0.5
clip.pass2 = true
clip.blend_pct = 6
clip.mode = warm

[Omnia-Talk]
description = Speech-forward preset for talk stations.
limiter.ceiling_db = -1.0
limiter.enabled = true
eq.enabled = true
eq.presence_db = 2.0
deess.enabled = true
loudness.target = -16.0
density.mid_hz = 2000
density.mid_strength = 35
density.enabled = true
ceiling.window_s = 1
ceiling.ceiling_lufs = -16.0
ceiling.enabled = true
preduck.enabled = true
preduck.detect_ms = 2
preduck.sensitivity = 55
preduck.range_db = 2.0
dualband.enabled = false
clip.pass1 = true
clip.pass2 = false

[FM-Reference]
description = FM air chain reference; MPX stage present, new DSP neutral.
limiter.ceiling_db = -0.1
limiter.enabled = true
fm.pilot_pct = 9
fm.preemphasis_us = 50
loudness.target = -23.0
ceiling.enabled = false
preduck.enabled = false
density.enabled = false
dualband.enabled = false
clip.pass1 = true
clip.ceiling_db = -0.1
clip.pass2 = false

[Encoder-Reference]
description = Transport defaults shared by every preset.
pts.clock_hz = 90000
pts.continuous_across_reconnect = true
reservoir.frames = 9
reservoir.mode = adjust
reservoir.underflow_warn_pct = 25
crc.per_frame = false
thread.policy = fifo
thread.priority = 80
thread.affinity = auto
lame.version = 3.100
lame.bitrate_min = 96
lame.bitrate_max = 320
lame.preset_standard = -V2
lame.preset_extreme = -V0
aac_hev2.bitrate_min = 24
aac_hev2.bitrate_max = 128
aac_hev2.latency_ms = 48
aac_hev2.transport = adts
aac_ld.bitrate_min = 64
aac_ld.bitrate_max = 192
aac_ld.latency_ms = 15
aac_ld.transport = latm
continuity.retain_days = 7
simulcast.primary = on
simulcast.secondary = off
simulcast.tertiary = off
failover.crossfade_ms = 200
failover.underrun_ms = 2000
failover.silence_ms = 5000
failover.restore_s = 10
src.auto_detect = true
src.taps = 512
src.warn_ppm = 1.0
