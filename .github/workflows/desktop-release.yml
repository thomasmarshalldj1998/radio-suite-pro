# Builds the Signalpath desktop installers on each native OS, so every
# artifact is produced with the platform's own toolchain (no wine/cross hacks).
name: desktop-release

# Every run is labelled with the workflow revision, so the Actions list shows
# at a glance whether a run used the current YAML or a stale re-run ("re-run
# jobs" replays the ORIGINAL commit and can never pick up a later fix).
# Only `github.*` here: the dispatch inputs are echoed by the diagnostics step
# below. A run-name expression is evaluated while the run is being created, and
# keeping one surface out of that path means a dispatch can never fail on it.
run-name: desktop-release rev 8 · ${{ github.ref_name }}

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Private-repo minutes are metered (linux 1x, windows 2x, macOS 10x),
      # so a manual run defaults to the cheap, proven Linux leg. Choose
      # "all" only when you actually need the Windows/macOS installers.
      # Tag pushes always build every platform (that is a real release).
      targets:
        description: "Installers to build"
        type: choice
        options:
          - linux
          - all
        default: linux
      # A tag push always publishes (see the last step of `build`). A manual
      # run publishes nothing unless a tag is named here - that is how a
      # platform skipped by an earlier release is filled in later: dispatch
      # `targets: all` + this tag, and its leg uploads onto that release. The
      # UI's "Use workflow from" dropdown only lists branches, so this is also
      # the only way to publish from a dispatch at all.
      release_tag:
        description: "Existing release tag to upload to (e.g. v.2.0.0); empty = build only"
        required: false
        default: ""

jobs:
  # Builds the matrix JSON from the dispatch input so a cheap test run only
  # schedules one runner instead of three.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.targets }}" = "linux" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","args":"--linux"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"ubuntu-latest","args":"--linux"},{"os":"windows-latest","args":"--win"},{"os":"macos-latest","args":"--mac --arm64 --x64"}]}' >> "$GITHUB_OUTPUT"
          fi

  # Publish gate: each leg attaches its own installers to the tag's release
  # the moment that leg is green (see the last step). There is deliberately
  # no shared `release` job that needs every platform: a macOS runner can sit
  # queued for 10+ minutes (or fail) long after Linux and Windows finished,
  # and gating on it withheld the whole release - the /latest/download/ links
  # for installers that already existed stayed 404. Publishing per leg means
  # Linux + Windows go live immediately and macOS lands whenever it builds.
  build:
    needs: prepare
    # The publish step writes the tag's release, so this job needs write
    # access; the workflow default stays read-only for everything else.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # macos-latest is Apple silicon; name both archs explicitly or only
      # arm64 would build (defaults to process.arch) and the Intel DMG link
      # on the site would 404.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # First thing after setup, print the facts that decide whether this run
      # can possibly pass: which commit/ref/event it is building, whether the
      # runner actually got the current workflow YAML, and the toolchain.
      # Never fails the build - it only records evidence into the log and the
      # run's Summary tab.
      - name: Run diagnostics
        shell: bash
        run: |
          bun_v="$(bun --version 2>/dev/null || echo unknown)"
          node_v="$(node --version 2>/dev/null || echo unknown)"
          {
            echo "workflow revision : 8"
            echo "commit            : ${{ github.sha }}"
            echo "ref               : ${{ github.ref }}"
            echo "event             : ${{ github.event_name }} (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
            echo "targets input     : '${{ inputs.targets }}'"
            echo "release tag input : '${{ inputs.release_tag }}'"
            echo "runner            : ${{ runner.os }} / ${{ runner.arch }}"
            echo "build args        : ${{ matrix.args }}"
            echo "bun / node        : $bun_v / $node_v"
            echo "checked-out HEAD  : $(git rev-parse --short HEAD 2>/dev/null || echo no-git)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo '::notice::manual run - inputs above decide which platforms build; re-running THIS run always reuses commit ${{ github.sha }}.'
          fi

      # --frozen-lockfile installs exactly the locked tree (and fails loudly
      # if bun.lock is missing) instead of silently floating versions, which
      # is a classic source of "green locally, red in CI" tsc failures.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fail fast with clear, named lines instead of a cryptic mid-build
      # tsc failure. tsc only reads the .d.ts files (no allowJs), so every
      # generated file is checked: a partial commit (e.g. api.js present but
      # server.d.ts missing) sails through a naive check and then dies in
      # tsc with exit code 2. Other build-critical files (toolbar import,
      # vite config, electron shell, icon script) are unrecoverable in CI,
      # so their absence aborts here; MISSING CONVEX TYPES ARE RECOVERABLE
      # via the codegen fallback step below.
      # Block scalars + shell: bash keep quoting identical on all three OSes
      # (windows runners default to pwsh, which mangles inline quotes).
      - name: Verify versioned sources
        id: verify
        shell: bash
        run: |
          echo "desktop-release workflow rev 8 (publish-per-platform, self-healing types, verify-all-files, cost-aware matrix, run diagnostics)"
          echo "commit: $(git rev-parse --short HEAD 2>/dev/null || echo 'no-git')"
          echo "checked-in _generated contents:"
          ls -la src/convex/_generated/ 2>/dev/null || echo "  (directory absent)"
          gen_missing=0
          for f in \
            src/convex/_generated/api.d.ts \
            src/convex/_generated/api.js \
            src/convex/_generated/dataModel.d.ts \
            src/convex/_generated/server.d.ts \
            src/convex/_generated/server.js \
          ; do
            if [ ! -f "$f" ]; then
              gen_missing=1
            fi
          done
          echo "gen_missing=$gen_missing" >> "$GITHUB_OUTPUT"
          hard_missing=0
          for f in \
            vly-toolbar-readonly.tsx \
            vite.desktop.config.ts \
            electron/main.cjs \
            scripts/make-icon.mjs \
            package.json \
            bun.lock \
          ; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the checkout - push it to the repo; the desktop build needs every listed file."
              hard_missing=1
            fi
          done
          [ "$hard_missing" -eq 0 ] || exit 1

          # The step name promises version checks, but until now it only
          # proved the files existed. These checks fail the release when
          # package.json and src/lib/version.ts disagree — 1.1.1 shipped
          # stamped 1.0.0 exactly that way.
          bun scripts/verify-version.ts

      # Self-healing fallback: if the committed Convex generated types are
      # absent or stale-incomplete, regenerate them in CI. Needs a Convex
      # deploy key secret (dashboard -> Settings -> Deploy keys). Committed
      # docs (see verbose notes) confirm committing the folder is the other
      # supported path, so this is a fallback, not a crutch.
      - name: Generate Convex types (fallback)
        if: steps.verify.outputs.gen_missing == '1'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        shell: bash
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo '::error::src/convex/_generated is missing or incomplete. Fix EITHER way: (1) commit all five generated files, or (2) add a CONVEX_DEPLOY_KEY secret (from the Convex dashboard) so this step can regenerate them.'
            exit 1
          fi
          echo '::notice::generated types missing from commit - regenerating via convex codegen'
          bunx convex codegen

      # Whatever the path above (committed files or just-regenerated), all
      # five files must exist before tsc runs.
      - name: Assert generated types
        shell: bash
        run: |
          missing=0
          for f in \
            src/convex/_generated/api.d.ts \
            src/convex/_generated/api.js \
            src/convex/_generated/dataModel.d.ts \
            src/convex/_generated/server.d.ts \
            src/convex/_generated/server.js \
          ; do
            if [ ! -f "$f" ]; then
              echo "::error::$f still missing after the generate fallback - cannot typecheck."
              missing=1
            fi
          done
          exit $missing

      # Every suite in scripts/verify-*.ts — the DSP chain, the MPX link, the
      # FM/RDS encoders and the console render path. Linux only: the logic is
      # platform-independent, and the Windows/macOS runners are metered.
      - name: Verify engine
        if: runner.os == 'Linux'
        run: bun run verify

      - name: Generate icon
        run: bun run desktop:icon

      - name: Build renderer
        run: bun run desktop:build:renderer

      # shell: bash on purpose - windows runners default to pwsh, and the
      # pipefail + tee below need bash so a failing electron-builder still
      # fails the step (a filtered pipeline must not swallow its status).
      - name: Package installers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release
          bunx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish never 2>&1 \
            | tee release/electron-builder.log

      # Only on failure: the packaging log and electron-builder's debug dump
      # are what let a red run be diagnosed from the artifacts page alone.
      - name: Upload packaging log (failed run)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signalpath-${{ matrix.os }}-logs
          path: |
            release/electron-builder.log
            release/builder-debug.yml
          if-no-files-found: warn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signalpath-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      # Attach THIS leg's installers to the tag's release immediately, so the
      # landing page's /releases/latest/download/… links resolve per platform
      # instead of all-or-nothing. gh ships on every runner; `create` is
      # guarded by a `view` probe and `upload --clobber` makes a re-run replace
      # its own files rather than fail on "already exists". Two legs may race
      # to create the release: the loser falls back to the winner's release and
      # still uploads, which is why the upload is not part of that `||`.
      - name: Publish installers for this platform
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          [ -n "$tag" ] || tag="${{ github.ref_name }}"
          echo "release target: $tag"
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb release/*.exe release/*.dmg release/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::the packaging step left no installers in release/ - nothing to publish'
            exit 1
          fi
          echo "publishing to $tag from ${{ matrix.os }}: ${files[*]}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            # The body is written once, by whichever platform finishes first,
            # so it names every installer the tag will eventually carry. The
            # macOS rows are honest about the gate: those files appear when
            # that leg completes, and the links 404 until they do.
            notes="$(printf '%s\n' \
              "Signalpath $tag — broadcast audio processor and stream encoder." \
              "" \
              "Installers are attached as each platform's build finishes, so a" \
              "download link below can briefly 404 while its build is still" \
              "running or queued (macOS runners are the slow ones)." \
              "" \
              "| Platform | Installer |" \
              "|---|---|" \
              "| Windows | \`Signalpath-Setup-x64.exe\` (NSIS) |" \
              "| macOS (Apple silicon) | \`Signalpath-arm64-mac.dmg\` |" \
              "| macOS (Intel) | \`Signalpath-x64-mac.dmg\` |" \
              "| Linux (universal) | \`Signalpath-x86_64.AppImage\` |" \
              "| Linux (Debian/Ubuntu) | \`signalpath-amd64.deb\` |")"
            gh release create "$tag" \
              --title "Signalpath $tag" \
              --notes "$notes" \
              || gh release view "$tag" > /dev/null
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          {
            echo "### Published ${{ matrix.os }} → $tag"
            printf -- '- `%s`\n' "${files[@]##*/}"
          } >> "$GITHUB_STEP_SUMMARY"