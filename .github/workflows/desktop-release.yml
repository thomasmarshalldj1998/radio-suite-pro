# Builds the Signalpath desktop installers on each native OS, so every
# artifact is produced with the platform's own toolchain (no wine/cross hacks).
name: desktop-release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-latest
            # macos-latest is Apple silicon; name both archs explicitly or
            # only arm64 would build (defaults to process.arch) and the
            # Intel DMG link on the site would 404.
            args: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile installs exactly the locked tree (and fails loudly
      # if bun.lock is missing) instead of silently floating versions, which
      # is a classic source of "green locally, red in CI" tsc failures.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fail fast with clear, named lines instead of a cryptic mid-build
      # tsc failure. tsc only reads the .d.ts files (no allowJs), so every
      # generated file is checked: a partial commit (e.g. api.js present but
      # server.d.ts missing) sails through a naive check and then dies in
      # tsc with exit code 2. Other build-critical files (toolbar import,
      # vite config, electron shell, icon script) are unrecoverable in CI,
      # so their absence aborts here; MISSING CONVEX TYPES ARE RECOVERABLE
      # via the codegen fallback step below.
      # Block scalars + shell: bash keep quoting identical on all three OSes
      # (windows runners default to pwsh, which mangles inline quotes).
      - name: Verify versioned sources
        id: verify
        shell: bash
        run: |
          echo "desktop-release workflow rev 5 (self-healing types + verify-all-files)"
          echo "commit: $(git rev-parse --short HEAD 2>/dev/null || echo 'no-git')"
          echo "checked-in _generated contents:"
          ls -la src/convex/_generated/ 2>/dev/null || echo "  (directory absent)"
          gen_missing=0
          for f in \
            src/convex/_generated/api.d.ts \
            src/convex/_generated/api.js \
            src/convex/_generated/dataModel.d.ts \
            src/convex/_generated/server.d.ts \
            src/convex/_generated/server.js \
          ; do
            if [ ! -f "$f" ]; then
              gen_missing=1
            fi
          done
          echo "gen_missing=$gen_missing" >> "$GITHUB_OUTPUT"
          hard_missing=0
          for f in \
            vly-toolbar-readonly.tsx \
            vite.desktop.config.ts \
            electron/main.cjs \
            scripts/make-icon.mjs \
            package.json \
            bun.lock \
          ; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the checkout - push it to the repo; the desktop build needs every listed file."
              hard_missing=1
            fi
          done
          exit $hard_missing

      # Self-healing fallback: if the committed Convex generated types are
      # absent or stale-incomplete, regenerate them in CI. Needs a Convex
      # deploy key secret (dashboard -> Settings -> Deploy keys). Committed
      # docs (see verbose notes) confirm committing the folder is the other
      # supported path, so this is a fallback, not a crutch.
      - name: Generate Convex types (fallback)
        if: steps.verify.outputs.gen_missing == '1'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        shell: bash
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo '::error::src/convex/_generated is missing or incomplete. Fix EITHER way: (1) commit all five generated files, or (2) add a CONVEX_DEPLOY_KEY secret (from the Convex dashboard) so this step can regenerate them.'
            exit 1
          fi
          echo '::notice::generated types missing from commit - regenerating via convex codegen'
          bunx convex codegen

      # Whatever the path above (committed files or just-regenerated), all
      # five files must exist before tsc runs.
      - name: Assert generated types
        shell: bash
        run: |
          missing=0
          for f in \
            src/convex/_generated/api.d.ts \
            src/convex/_generated/api.js \
            src/convex/_generated/dataModel.d.ts \
            src/convex/_generated/server.d.ts \
            src/convex/_generated/server.js \
          ; do
            if [ ! -f "$f" ]; then
              echo "::error::$f still missing after the generate fallback - cannot typecheck."
              missing=1
            fi
          done
          exit $missing

      - name: Generate icon
        run: bun run desktop:icon

      - name: Build renderer
        run: bun run desktop:build:renderer

      - name: Package installers
        run: bunx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signalpath-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  # Publish every platform's installers on one GitHub Release per v* tag, so
  # the site can link to stable /releases/latest/download/… URLs.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Signalpath ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          body: |
            Signalpath ${{ github.ref_name }} — broadcast audio processor and stream encoder.

            | Platform | Installer |
            |---|---|
            | Windows | `Signalpath-Setup-x64.exe` (NSIS) |
            | macOS (Apple silicon) | `Signalpath-arm64-mac.dmg` |
            | macOS (Intel) | `Signalpath-x64-mac.dmg` |
            | Linux (universal) | `Signalpath-x86_64.AppImage` |
            | Linux (Debian/Ubuntu) | `signalpath-amd64.deb` |
