# Builds the Signalpath desktop installers on each native OS, so every
# artifact is produced with the platform's own toolchain (no wine/cross hacks).
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate icon
        run: bun run desktop:icon

      - name: Build renderer
        run: bun run desktop:build:renderer

      - name: Package installers
        run: bunx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signalpath-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  # Publish every platform's installers on one GitHub Release per v* tag, so
  # the site can link to stable /releases/latest/download/… URLs.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Signalpath ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          body: |
            Signalpath ${{ github.ref_name }} — broadcast audio processor and stream encoder.

            | Platform | Installer |
            |---|---|
            | Windows | `Signalpath-Setup-x64.exe` (NSIS) |
            | macOS (Apple silicon) | `Signalpath-arm64-mac.dmg` |
            | macOS (Intel) | `Signalpath-x64-mac.dmg` |
            | Linux (universal) | `Signalpath-x86_64.AppImage` |
            | Linux (Debian/Ubuntu) | `signalpath-amd64.deb` |
