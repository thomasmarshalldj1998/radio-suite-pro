# Builds the Signalpath desktop installers on each native OS, so every
# artifact is produced with the platform's own toolchain (no wine/cross hacks).
name: desktop-release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-latest
            # macos-latest is Apple silicon; name both archs explicitly or
            # only arm64 would build (defaults to process.arch) and the
            # Intel DMG link on the site would 404.
            args: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Fail fast with one clear line instead of a cryptic mid-build failure
      # if the checkout is incomplete. tsc only reads the .d.ts files
      # (no allowJs), so every generated file is checked: a partial commit
      # (e.g. api.js present but server.d.ts missing) sails through a naive
      # existence check and then fails the build with tsc exit code 2. The
      # same guard covers the other build-critical files (toolbar import,
      # desktop vite config, electron shell, icon script).
      # Block scalar + shell: bash keeps quoting identical on all three OSes
      # (windows runners default to pwsh, which mangles inline quotes).
      - name: Verify versioned sources
        shell: bash
        run: |
          echo "desktop-release workflow rev 4 (verify-all-files, bash, dual-arch-mac)"
          missing=0
          for f in \
            src/convex/_generated/api.d.ts \
            src/convex/_generated/api.js \
            src/convex/_generated/dataModel.d.ts \
            src/convex/_generated/server.d.ts \
            src/convex/_generated/server.js \
            vly-toolbar-readonly.tsx \
            vite.desktop.config.ts \
            electron/main.cjs \
            scripts/make-icon.mjs \
          ; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the checkout - push it to the repo; the desktop build needs every listed file."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then ls -la src/convex/_generated/ || true; fi
          exit $missing

      - name: Generate icon
        run: bun run desktop:icon

      - name: Build renderer
        run: bun run desktop:build:renderer

      - name: Package installers
        run: bunx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signalpath-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  # Publish every platform's installers on one GitHub Release per v* tag, so
  # the site can link to stable /releases/latest/download/… URLs.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Signalpath ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          body: |
            Signalpath ${{ github.ref_name }} — broadcast audio processor and stream encoder.

            | Platform | Installer |
            |---|---|
            | Windows | `Signalpath-Setup-x64.exe` (NSIS) |
            | macOS (Apple silicon) | `Signalpath-arm64-mac.dmg` |
            | macOS (Intel) | `Signalpath-x64-mac.dmg` |
            | Linux (universal) | `Signalpath-x86_64.AppImage` |
            | Linux (Debian/Ubuntu) | `signalpath-amd64.deb` |
