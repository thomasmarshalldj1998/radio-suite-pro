# SignalPath Full Chain — processor order and preset definitions
#
# Data only: the console preset browser and the Python chain builder read the
# same file. Every processor is bypassed unless a preset enables it. Values are
# dBFS/LUFS for levels, ms for time, % for 0–100 controls, Hz for frequencies,
# and kbps for bitrate.
#
# Module defaults live in each proc_*.py file. A preset only needs to name the
# stages it changes; the loader starts from the module defaults.

[meta]
name = SignalPath Full Chain
version = 4.0
build = 4.0.0
author = Signalpath
notes = Input conditioning → repair → tonal → dynamics → stereo → harmonics → loudness → protection → codec pre-shape.
latency_budget_ms = 40

[chain]
# 40 stages, in processing order. Analysis/preview stages are marked so a
# realtime builder can skip them without changing the audio path.
order = input_dc_phase, clip_repair_declick, hum_canceller, noise_adaptive_hiss, adaptive_noise_gate, source_match_eq, parametric_eq_6band, de_mud_clarity, dynamic_tilt, bass_sculptor_3band, vocal_presence_isolate, de_esser_psycho, air_brilliance, agc_dual_speed, upward_compressor, downward_compressor, multiband_compressor, envelope_shaper, density_control, ms_dynamic_width, stereo_enhancer_3band, ambience_recovery, bass_phase_lock, mono_compat_alert, downmix_preview, saturation_2nd_order, harmonic_edge_3rd, tape_emulation, pre_emphasis_filter, short_term_loudness, loudness_gate_silence, lra_dynamic_range_preserve, true_peak_guard, lookahead_limiter, soft_knee_clipper, twopass_protection, overshoot_correction, perceptual_rolloff, bitrate_allocation, stereo_bandwidth_limit
analysis_only = mono_compat_alert, downmix_preview
preview_only = downmix_preview
control_only = bitrate_allocation
safety_stages = true_peak_guard, lookahead_limiter, soft_knee_clipper, twopass_protection, overshoot_correction

